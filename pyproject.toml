[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mfetos"
version = "0.1.0"
description = "Point-in-time, evidence-backed Indian IPO research over LangGraph and MCP"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3",
  "langgraph>=1.2.20,<2", "langgraph-checkpoint-sqlite>=3.1.3,<4",
  "mcp>=2.3,<3", "httpx>=0.28,<1", "pdfplumber>=0.11,<0.12",
  "beautifulsoup4>=4.13,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "reportlab>=4,<5", "ruff>=0.11,<1"]
ocr = ["pytesseract>=0.3.13,<0.4", "pypdfium2>=4,<6"]

[project.scripts]
mfetos = "mfetos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: downloads real public documents; opt in with MFETOS_LIVE_TESTS=1"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
